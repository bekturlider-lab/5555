[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "b-bank"
version = "1.0.0"
description = "Учебный банк для студенческих соревнований"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3", "argon2-cffi>=23,<26",
  "alembic>=1.14,<2", "maxminddb>=2.6,<4", "httpx>=0.28,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pgserver==0.1.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
