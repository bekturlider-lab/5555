services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: YOUR_VALUE_HERE
      POSTGRES_DB: campus
    volumes:
      - bank-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus"]
      interval: 5s
      retries: 10
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://campus:local-only-campus@db:5432/campus
      APP_SECRET: YOUR_VALUE_HERE
      APP_ENV: local
      ALLOWED_HOSTS: localhost,127.0.0.1
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
volumes:
  bank-data:
